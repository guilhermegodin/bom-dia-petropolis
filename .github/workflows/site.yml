name: Publicar site

on:
  push:
    branches: [main]
  # Roda depois de cada rodada do robô (commits do robô não disparam o "push" acima)
  workflow_run:
    workflows: ["Robô de notícias"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m robo.site
        env:
          # Contador de visitas e números do Mídia Kit (veja o README, seção "Audiência e anúncios")
          GOATCOUNTER_CODIGO: ${{ vars.GOATCOUNTER_CODIGO }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
